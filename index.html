<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime Watch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>ANIME WATCH</h1>
        <p>Watch your favorite anime</p>
    </header>


    <!-- Anime Cards -->
    <main class="anime-container">

        <!-- Demon Slayer -->
        <div class="anime-card">

            <img src="images/demon-slayer.jpg" alt="Demon Slayer">

            <h2>Demon Slayer</h2>

            <a
                href="https://uplcm.com/4/11971534"
                target="_blank"
                rel="noopener noreferrer"
                class="watch-btn"
            >
                WATCH VIDEO
            </a>

        </div>


        <!-- Naruto -->
        <div class="anime-card">

            <img src="images/naruto.jpg" alt="Naruto">

            <h2>Naruto</h2>

            <a
                href="https://uplcm.com/4/11971534"
                target="_blank"
                rel="noopener noreferrer"
                class="watch-btn"
            >
                WATCH VIDEO
            </a>

        </div>


        <!-- Attack on Titan -->
        <div class="anime-card">

            <img src="images/aot.jpg" alt="Attack on Titan">

            <h2>Attack on Titan</h2>

            <a
                href="https://uplcm.com/4/11971534"
                target="_blank"
                rel="noopener noreferrer"
                class="watch-btn"
            >
                WATCH VIDEO
            </a>

        </div>


        <!-- Solo Leveling -->
        <div class="anime-card">

            <img src="images/solo-leveling.jpg" alt="Solo Leveling">

            <h2>Solo Leveling</h2>

            <a
                href="https://uplcm.com/4/11971534"
                target="_blank"
                rel="noopener noreferrer"
                class="watch-btn"
            >
                WATCH VIDEO
            </a>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 Anime Watch</p>
    </footer>

</body>
</html>
